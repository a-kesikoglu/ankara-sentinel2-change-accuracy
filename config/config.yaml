project:
  name: sentinel2_lulc_change
  gee_project: synthetic-span-378808
  crs: EPSG:32636
  pixel_size_m: 10
  seed: 42

study_area:
  name: Ankara western urban corridor (Yenimahalle, Etimesgut, Sincan)
  bbox_wgs84: [32.48, 39.86, 32.78, 40.01]   # lon_min, lat_min, lon_max, lat_max

periods:
  t1:
    year: 2018
    spring: ["2018-04-01", "2018-06-15"]
    summer: ["2018-07-01", "2018-09-30"]
  t2:
    year: 2025
    spring: ["2025-04-01", "2025-06-15"]
    summer: ["2025-07-01", "2025-09-30"]

sentinel2:
  collection: COPERNICUS/S2_SR_HARMONIZED
  cloud_probability: COPERNICUS/S2_CLOUD_PROBABILITY
  max_scene_cloud_percent: 60
  cloud_probability_threshold: 40
  scl_masked_classes: [0, 1, 3, 8, 9, 10, 11]  # no data, saturated, shadow, cloud med/high, cirrus, snow
  composite: median
  bands: [B2, B3, B4, B5, B6, B7, B8, B8A, B11, B12]
  indices: [NDVI, NDWI, MNDWI, NDBI, NDMI, BSI]

classes:
  1: water
  2: tree_cover
  3: low_vegetation   # cropland, grassland, shrubland
  4: built_up
  5: bare_sparse

training:
  source: stable consensus of Dynamic World V1 (annual mode 2018 and 2025) and ESA WorldCover v200 (2021)
  dw_min_probability: 0.5
  samples_per_class_per_year: 700
  min_spacing_m: 100

classification:
  rf: {n_estimators: 500, max_features: sqrt, min_samples_leaf: 1, class_weight: balanced}
  svm: {kernel: rbf, C_grid: [1, 10, 100, 1000], gamma_grid: [0.01, 0.1, 1]}

postprocessing:
  majority_filter: 3x3
  mmu_pixels: 5

validation:
  design: stratified random sampling on the post-classification change map (Olofsson et al. 2014)
  reference: visual interpretation of Esri World Imagery Wayback (VHR) + Sentinel-2 composites
